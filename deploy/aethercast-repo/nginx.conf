server {
    listen 80;
    listen [::]:80;
    server_name aethercast.org;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aethercast.org;

    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/aethercast-apex/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aethercast-apex/privkey.pem;

    access_log /data/logs/aethercast-repo_access.log proxy;
    error_log /data/logs/aethercast-repo_error.log warn;

    location = /repo {
        default_type application/json;
        alias /data/aethercast-repo/repo.json;
        add_header Cache-Control "no-cache";
    }

    location = /repo/repo.json {
        default_type application/json;
        alias /data/aethercast-repo/repo.json;
        add_header Cache-Control "no-cache";
    }

    location /repo/images/ {
        alias /data/aethercast-repo/images/;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 404;
    }
}
